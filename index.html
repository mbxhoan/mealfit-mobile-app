<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Mealfit — quản lý đơn hàng và giao hàng trên điện thoại." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mealfit</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"><main class="startup-splash" role="status" aria-live="polite"><img src="/logo-transparent.png" alt="Mealfit"/><span class="spinner" aria-hidden="true"></span><strong>Đang mở Mealfit</strong><small>Đang khôi phục dữ liệu trên thiết bị</small></main></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
    <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
